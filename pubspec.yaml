  build_runner: ^2.4.9
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
